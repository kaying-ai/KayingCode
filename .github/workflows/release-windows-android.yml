name: Build signed Windows and Android releases

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Validate product release tag
        id: version
        run: |
          node --test scripts/first-public-release.test.mjs
          version=$(node -p 'require("./package.json").version')
          channel=$(node --input-type=module -e 'import { resolveLinuxReleaseTag } from "./scripts/linux-release-tag.mjs"; console.log(resolveLinuxReleaseTag(...process.argv.slice(1)));' "$version" "$(git rev-parse HEAD)" "$GITHUB_REF")
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    environment: windows-release
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      HUSKY: "0"
      KAYINGCODE_ENV: production
      KAYINGCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"
      - name: Install workspace dependencies
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --child-concurrency=1
      - name: Fetch Windows ripgrep archive
        run: |
          archive=ripgrep-v14.1.1-1-x86_64-pc-windows-msvc.zip
          destination=apps/zcode-cli/packages/cli/dependencies/native-search/ripgrep-v14.1.1-1
          mkdir -p "$destination"
          curl --fail --location --retry 3 --output "$destination/$archive" "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v14.1.1-1/$archive"
      - name: Build signed Windows installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          test -n "$WIN_CSC_LINK" && test -n "$WIN_CSC_KEY_PASSWORD"
          pnpm run bundle:desktop -- --os win --arch x64
      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'packages/desktop/dist/KayingCode-*-win-x64.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $signature = Get-AuthenticodeSignature $files[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-windows-x64-${{ needs.validate.outputs.channel }}-signed
          if-no-files-found: error
          compression-level: 0
          path: packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-win-x64.exe

  android:
    needs: validate
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/kayingcode-mobile-flutter
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android NDK and Flutter
        run: |
          ndk_version=$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"([0-9]+(\.[0-9]+)+)"[[:space:]]*$/\1/p' android/app/build.gradle.kts)
          test -n "$ndk_version"
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;$ndk_version"
          test -f "$ANDROID_HOME/ndk/$ndk_version/source.properties"
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync(".fvmrc", "utf8")).flutter')
          mkdir -p .fvm
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git .fvm/flutter_sdk
          node scripts/flutter-target.mjs android check
          node scripts/flutter-target.mjs android pub-get
      - name: Build and verify Android release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_STOREPASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEYALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEYPASSWORD }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STOREPASSWORD ANDROID_KEYALIAS ANDROID_KEYPASSWORD; do test -n "${!name}"; done
          umask 077
          export ANDROID_STOREFILE="$RUNNER_TEMP/kayingcode-release.keystore"
          trap 'rm -f "$ANDROID_STOREFILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_STOREFILE"
          unset ANDROID_KEYSTORE_BASE64
          node scripts/flutter-target.mjs android check
          node scripts/flutter-target.mjs android release
          apk="build/app/outputs/flutter-apk/KayingCode-$RELEASE_VERSION-android-universal.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-android-${{ needs.validate.outputs.channel }}-signed
          if-no-files-found: error
          compression-level: 0
          path: apps/kayingcode-mobile-flutter/build/app/outputs/flutter-apk/KayingCode-${{ needs.validate.outputs.version }}-android-universal.apk
