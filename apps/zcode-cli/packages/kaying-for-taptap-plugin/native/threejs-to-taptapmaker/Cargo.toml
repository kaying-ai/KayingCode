[package]
name = "t3m"
version = "0.2.6"
edition = "2021"
description = "three.js -> TapTap Maker (UrhoX Lua) transcription toolkit: fetch a web game's sources, analyse the engine gaps, convert level data to Lua, lint the transcribed project."
license = "MIT"
[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "t3m"
path = "src/main.rs"

[profile.release]
opt-level = 2
