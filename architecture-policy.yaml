version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: agent-gateway
    roots: [packages/agent-gateway/src]
    managed: true
    requires: [rpc, services, shared]
    publicEntrypoints: [packages/agent-gateway/src/contract.ts]
    owner: remote-agent
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: product-site
    roots: [apps/kayingcode-site]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: agent-cli-types
    roots: [apps/zcode-cli/packages/shared-types/src]
    managed: false
  - id: agent-contracts
    roots: [apps/zcode-cli/packages/contracts/src]
    managed: false
  - id: agent-runtime
    roots: [apps/zcode-cli/packages/core/src]
    managed: false
  - id: agent-adapters
    roots: [apps/zcode-cli/packages/adapters/src]
    managed: false
  - id: agent-bootstrap
    roots: [apps/zcode-cli/packages/bootstrap/src]
    managed: false
  - id: agent-i18n
    roots: [apps/zcode-cli/packages/i18n/src]
    managed: false
  - id: agent-telemetry
    roots: [apps/zcode-cli/packages/telemetry/src]
    managed: false
  - id: terminal-ui
    roots: [apps/zcode-cli/packages/tui/src]
    managed: false
  - id: dynamic-workflow
    roots: [apps/zcode-cli/packages/dynamic-workflow/src]
    managed: false
  - id: dynamic-workflow-runtime
    roots: [apps/zcode-cli/packages/dynamic-workflow-runtime/src]
    managed: false
  - id: node-repl-host
    roots: [apps/zcode-cli/packages/node-repl-host/src]
    managed: false
  - id: plugins
    roots: [plugins]
    managed: false
  - id: kayingcode-cli
    roots: [apps/zcode-cli/packages/cli]
    managed: false
  - id: relay-cloudflare
    roots: [apps/kayingcode-relay-cloudflare/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [apps/kayingcode-relay-cloudflare/src/contract.ts]
    owner: mobile-access
  - id: mobile-client-core
    roots: [packages/mobile-client-core/src]
    managed: true
    requires: [shared, client, services]
    publicEntrypoints: [packages/mobile-client-core/src/contract.ts]
    owner: mobile-access
  - id: mobile
    roots: [apps/kayingcode-mobile-taro/src]
    managed: true
    requires: [shared, client, mobile-client-core]
    publicEntrypoints: [apps/kayingcode-mobile-taro/src/app.tsx]
    owner: mobile-access

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
