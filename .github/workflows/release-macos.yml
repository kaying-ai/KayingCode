name: Build signed macOS release

on:
  push:
    tags:
      - "kaying-code-v*"
      - "kaying-code-preflight-v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Validate product release tag
        id: version
        run: |
          node --test scripts/first-public-release.test.mjs
          version=$(node -p 'require("./package.json").version')
          channel=$(node --input-type=module -e 'import { resolveLinuxReleaseTag } from "./scripts/linux-release-tag.mjs"; console.log(resolveLinuxReleaseTag(...process.argv.slice(1)));' "$version" "$(git rev-parse HEAD)" "$GITHUB_REF")
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  sign:
    name: Sign macOS (${{ matrix.arch }})
    needs: validate
    environment: macos-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, arch: x64 }
          - { runner: macos-15, arch: arm64 }
    env:
      HUSKY: "0"
      KAYINGCODE_ENV: production
      KAYINGCODE_ENABLE_MAC_SIGN: "1"
      KAYINGCODE_ENABLE_MAC_NOTARIZE: "1"
      KAYINGCODE_SKIP_REMOTE_ASSETS: "1"
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Install workspace dependencies
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --child-concurrency=1
      - name: Sign and notarize the macOS installer
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing macos-release secret $name"
              exit 1
            fi
          done

          previous_umask=$(umask)
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/kayingcode-macos.XXXXXXXX")
          keychain="$signing_dir/release.keychain-db"
          p12="$signing_dir/developer-id.p12"
          export APPLE_API_KEY="$signing_dir/notary.p8"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$p12" "$APPLE_API_KEY"' EXIT
          printf '%s' "$MAC_CSC_LINK" | base64 -D > "$p12"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"

          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$p12"
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 keychain_password
          umask "$previous_umask"

          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2 }')
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo '::error::The P12 must contain one valid Developer ID Application identity with its private key'
            exit 1
          fi

          # Computer Use 插件在 Electron 打包前签名，两个阶段使用同一个临时钥匙串。
          KAYING_COMPUTER_USE_CODESIGN_MODE=identity \
          KAYING_COMPUTER_USE_CODESIGN_IDENTITY="$identity" \
          KAYING_COMPUTER_USE_CODESIGN_KEYCHAIN="$keychain" \
            pnpm run bundle:desktop -- --os mac --arch "$TARGET_ARCH"

          dmg="packages/desktop/dist/KayingCode-$RELEASE_VERSION-mac-$TARGET_ARCH.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-macos-${{ matrix.arch }}-${{ needs.validate.outputs.channel }}-signed
          if-no-files-found: error
          compression-level: 0
          path: packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-mac-${{ matrix.arch }}.dmg
