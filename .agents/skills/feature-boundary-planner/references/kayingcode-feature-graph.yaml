        symbol: WebRemoteControlDialog
      - file: packages/ui/src/BotsDialog.tsx
        symbol: BotsDialog
    invariants:
      - Main owns V2 connection state and the existing Host owns Bot configuration.
      - The dialog adopts upstream layout and channel flows; closing or replacement rejects stale UI results.

