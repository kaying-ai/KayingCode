[package]
name = "kaying-for-taptap-core"
description = "Unified KayingForTaptap native core — TapTap Maker operations"
version = "1.7.0"
edition = "2024"
rust-version = "1.85"
authors = ["Kaying Studio"]
license = "MIT"
repository = "https://gitee.com/citiao/ZCode"
homepage = "https://kaying.dev"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kaying-for-taptap-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
