name: Build signed Linux release

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Validate product release tag
        id: version
        run: |
          node --test scripts/first-public-release.test.mjs
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" != "refs/tags/kaying-code-v$version" ]]; then
            echo "::error::Run this workflow on the kaying-code-v$version release tag"
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Build and sign Linux (${{ matrix.arch }})
    needs: validate
    environment: linux-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    env:
      HUSKY: "0"
      KAYINGCODE_ENV: production
      KAYINGCODE_SKIP_REMOTE_ASSETS: "1"
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg libarchive-tools rpm xz-utils zstd
      - name: Install workspace dependencies
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --child-concurrency=1
      - name: Build Linux installer
        run: pnpm run bundle:desktop -- --os linux --arch "$TARGET_ARCH"
      - name: Sign and verify checksums
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: bash scripts/sign-linux-release.sh packages/desktop/dist "$RELEASE_VERSION" "$TARGET_ARCH" packages/desktop/build/linux-signing/release-public-key.asc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}-signed
          if-no-files-found: error
          compression-level: 0
          path: |
            packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.AppImage
            packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.deb
            packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.rpm
            packages/desktop/dist/KayingCode-${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.pkg.tar.zst
            packages/desktop/dist/SHA256SUMS-linux-${{ matrix.arch }}*
            packages/desktop/dist/KayingCode-linux-release-public-key.asc
