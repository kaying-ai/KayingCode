name: Build platform artifacts

on:
  push:
    tags: ["kaying-code-v*", "kaying-code-test-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Platform group to build
        type: choice
        options: [all, desktop, mobile]
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/kaying-code-v') && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Validate product version and tag
        id: version
        run: |
          node --test scripts/first-public-release.test.mjs
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" == kaying-code-test-v* ]]; then
              commit=$(git rev-parse HEAD)
              expected_tag="kaying-code-test-v$version-${commit:0:12}"
            else
              git merge-base --is-ancestor HEAD refs/remotes/origin/main
              expected_tag="kaying-code-v$version"
            fi
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "::error::Expected tag $expected_tag"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.os }}-${{ matrix.arch }})
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'desktop'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, os: win, arch: x64 }
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    env:
      HUSKY: "0"
      KAYINGCODE_PREVIEW_IDENTITY: "1"
      KAYINGCODE_ENABLE_MAC_SIGN: "0"
      KAYINGCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version: "1.3.14"
      - name: Select Xcode 26.2
        if: matrix.os == 'mac'
        run: |
          # 随包 Computer Use 插件使用 Swift 6.2，macOS 15 runner 的默认 Xcode 版本较旧。
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm xz-utils zstd
      - name: Install workspace dependencies
        run: |
          npm install --global pnpm@10.31.0
          pnpm install --frozen-lockfile --child-concurrency=1
      - name: Fetch Windows ripgrep archive
        if: matrix.os == 'win'
        run: |
          # 源码快照未收录此归档，prepare:native-search 会校验其摘要和架构。
          archive=ripgrep-v14.1.1-1-x86_64-pc-windows-msvc.zip
          destination=apps/zcode-cli/packages/cli/dependencies/native-search/ripgrep-v14.1.1-1
          mkdir -p "$destination"
          curl --fail --location --retry 3 \
            --output "$destination/$archive" \
            "https://github.com/microsoft/ripgrep-prebuilt/releases/download/v14.1.1-1/$archive"
      - name: Build desktop installer
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: pnpm run bundle:desktop -- --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-desktop-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst

  mobile:
    name: Flutter (android)
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/kayingcode-mobile-flutter
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android NDK
        run: |
          ndk_version=$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"([0-9]+(\.[0-9]+)+)"[[:space:]]*$/\1/p' android/app/build.gradle.kts)
          if [[ -z "$ndk_version" ]]; then
            echo '::error::No pinned ndkVersion found in android/app/build.gradle.kts'
            exit 1
          fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Runner 缺少此 NDK 的许可，安装时应答。sdkmanager 退出后 yes 的 SIGPIPE 不应掩盖安装结果。
          { yes || true; } | "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "ndk;$ndk_version"
          test -f "$ANDROID_HOME/ndk/$ndk_version/source.properties"
      - name: Install pinned Flutter SDK
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync(".fvmrc", "utf8")).flutter')
          mkdir -p .fvm
          git clone --depth 1 --branch "$version" https://github.com/flutter/flutter.git .fvm/flutter_sdk
      - name: Build Android debug APK
        run: |
          node scripts/flutter-target.mjs android check
          node scripts/flutter-target.mjs android pub-get
          node scripts/flutter-target.mjs android debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KayingCode-${{ needs.validate.outputs.version }}-flutter-android
          if-no-files-found: error
          compression-level: 0
          path: apps/kayingcode-mobile-flutter/build/app/outputs/flutter-apk/KayingCode-*-android-universal-debug.apk
