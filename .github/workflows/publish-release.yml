name: Publish GitHub release

on:
  workflow_run:
    workflows:
      - Build signed Linux release
      - Build signed macOS release
      - Build signed Windows and Android releases
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Product tag to publish, for example kaying-code-v0.1.2
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'kaying-code-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve tag
        id: tag
        env:
          REF: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          if [[ ! "$REF" =~ ^kaying-code-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unsupported release tag: $REF"
            exit 1
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#kaying-code-v}" >> "$GITHUB_OUTPUT"
      - name: Collect successful build runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          workflows=(
            "Build signed Linux release"
            "Build signed macOS release"
            "Build signed Windows and Android releases"
          )
          for attempt in 1 2 3; do
            ids=()
            pending=0
            failed=0
            for name in "${workflows[@]}"; do
              # 取该标签下最新的构建运行（标签推送或手动 dispatch）；rerun 后状态为最新一次尝试。
              line=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
                --jq ".workflow_runs[] | select(.head_branch == \"$TAG\" and .name == \"$name\" and (.event == \"push\" or .event == \"workflow_dispatch\")) | [.id, .status, .conclusion] | @tsv" \
                | sort -n | tail -1)
              if [[ -z "$line" ]]; then
                echo "waiting for $name"
                pending=1
                continue
              fi
              id=${line%%$'\t'*}
              rest=${line#*$'\t'}
              status=${rest%%$'\t'*}
              conclusion=${rest#*$'\t'}
              if [[ "$status" != "completed" ]]; then
                echo "waiting for $name ($status)"
                pending=1
                continue
              fi
              if [[ "$conclusion" != "success" ]]; then
                echo "::error::$name finished with $conclusion"
                failed=1
                continue
              fi
              ids+=("$id")
            done
            if [[ $failed -eq 1 ]]; then
              exit 1
            fi
            if [[ $pending -eq 0 ]]; then
              printf 'ids=%s\n' "$(IFS=,; echo "${ids[*]}")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          # 其他构建尚未结束时先退出；最后完成的构建会再次触发本工作流。
          echo "Not all release builds have completed yet; waiting for another run."
      - name: Download artifacts
        if: steps.runs.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist release
          IFS=',' read -ra ids <<< "${{ steps.runs.outputs.ids }}"
          for id in "${ids[@]}"; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -D "dist/$id"
          done
          declare -A seen
          while IFS= read -r file; do
            base=$(basename "$file")
            [[ -n "${seen[$base]:-}" ]] && continue
            seen[$base]=1
            cp "$file" "release/$base"
          done < <(find dist -type f | sort)
      - name: Generate checksums
        if: steps.runs.outputs.ids != ''
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name "SHA256SUMS-$VERSION.txt" -printf '%f\n' \
            | sort | xargs sha256sum > "SHA256SUMS-$VERSION.txt"
      - name: Create or update release
        if: steps.runs.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' 2>/dev/null | grep -qx "SHA256SUMS-$VERSION.txt"; then
            echo "Release $TAG already has its checksum asset; nothing to do."
            exit 0
          fi
          node scripts/release-notes.mjs "$TAG" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --title "KayingCode $VERSION" --notes-file notes.md --verify-tag
          fi
      - name: Trigger CNB site sync
        if: success() && steps.runs.outputs.ids != ''
        env:
          CNB_TRIGGER_TOKEN: ${{ secrets.CNB_TRIGGER_TOKEN }}
          CNB_RELEASE_TOKEN: ${{ secrets.CNB_RELEASE_TOKEN || secrets.CNB_TRIGGER_TOKEN }}
          SITE_GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN || secrets.SITE_DISPATCH_TOKEN }}
          CNB_SITE_REPO: kayingai/site-kayingai.com
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$CNB_TRIGGER_TOKEN"
          test -n "$CNB_RELEASE_TOKEN"
          test -n "$SITE_GITHUB_TOKEN"
          payload=$(mktemp)
          trap 'rm -f "$payload"' EXIT
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg cnb "$CNB_RELEASE_TOKEN" \
            --arg gh "$SITE_GITHUB_TOKEN" \
            '{branch:"main",event:"api_trigger_release",env:{RELEASE_TAG:$tag,KAYING_RELEASE_CNB_TOKEN:$cnb,SITE_GITHUB_TOKEN:$gh},title:("Sync site for " + $tag)}' > "$payload"
          response=$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CNB_TRIGGER_TOKEN}" \
            --header "Accept: application/vnd.cnb.api+json" \
            --header "Content-Type: application/json" \
            --data @"$payload" \
            "https://api.cnb.cool/${CNB_SITE_REPO}/-/build/start")
          printf '%s\n' "$response"
          sn=$(printf '%s' "$response" | jq -r '.sn // empty')
          build_url=$(printf '%s' "$response" | jq -r '.buildLogUrl // empty')
          test -n "$sn"
          echo "CNB build: $sn"
          echo "CNB log: $build_url"
          for attempt in $(seq 1 180); do
            status_json=$(curl --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${CNB_TRIGGER_TOKEN}" \
              --header "Accept: application/vnd.cnb.api+json" \
              "https://api.cnb.cool/${CNB_SITE_REPO}/-/build/status/${sn}" || true)
            state=$(printf '%s' "$status_json" | jq -r '.status // empty' 2>/dev/null || true)
            echo "CNB status [$attempt]: ${state:-unknown}"
            case "$state" in
              success|skipped) exit 0 ;;
              error|cancel)
                printf '%s\n' "$status_json"
                echo "::error::CNB build ${sn} ended with ${state}: ${build_url}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for CNB build ${sn}: ${build_url}"
          exit 1
